[package]
name = "isotpkit-py"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Python bindings for isotpkit (ISO 15765-2:2016 ISO-TP / DoCAN codec)."
license = "Apache-2.0"
publish = false

[lib]
# The Rust crate name differs from the `isotpkit` dependency to avoid a name clash; the Python
# module is named `isotpkit` by the `#[pymodule]` function and maturin's `module-name`.
name = "isotpkit_py"
crate-type = ["cdylib"]

[dependencies]
isotpkit = { path = ".." }
pyo3 = { version = "0.30.1", features = ["extension-module", "abi3-py39"] }

[lints.rust]
# pyo3's macros generate `unsafe` impls, so — unlike the core codec — this bindings crate allows it.
unsafe_code = "allow"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Same as the core crate: ISO 15765-2 abbreviations (STmin, N_PCItype, …) read as prose.
doc_markdown = "allow"
module_name_repetitions = "allow"
