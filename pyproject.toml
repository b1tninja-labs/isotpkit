[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "isotpkit"
dynamic = ["version"]
description = "An offline ISO-TP (ISO 15765-2:2016, DoCAN) transport/network-layer codec: it segments a UDS/GMLAN application PDU into SingleFrame, FirstFrame, ConsecutiveFrame and FlowControl N_PDUs and reassembles them, on classic-CAN 8-byte frames. It encodes and decodes frames and runs the segmentation state machine; it does not open a bus or run a live timer loop. It is the transport layer under the application-layer sibling udsdiag and does not depend on it."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Justin Capella" }]
keywords = ["iso-tp", "iso15765", "docan", "can", "uds", "gmlan", "transport"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]

[project.scripts]
isotpkit = "isotpkit.cli:main"

[tool.hatch.version]
path = "isotpkit/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["isotpkit"]

[tool.hatch.build.targets.sdist]
include = ["/isotpkit/", "/tests/", "/docs/", "/README.md", "/ROADMAP.md", "/PLAN.md", "/LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "N", "UP", "SIM", "C4", "PT", "RUF", "S", "RET", "ARG"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
